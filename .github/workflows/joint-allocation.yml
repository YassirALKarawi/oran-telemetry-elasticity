name: Reproduce joint allocation foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'joint_allocation/**'
      - '.github/workflows/joint-allocation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r joint_allocation/requirements.txt
      - name: Record environment
        run: python -m pip freeze > environment.txt
      - name: Independent correctness tests
        run: python -m unittest discover -s joint_allocation -p 'test_*.py' -v
      - name: Reproduce all development instances
        run: python joint_allocation/experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: joint-allocation-reproduction
          path: |
            joint_allocation/results.json.gz
            environment.txt
